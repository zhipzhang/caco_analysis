[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caco-analysis"
version = "0.1.0"
description = "Analysis tools for LST-1 camera hardware monitoring data (CaCo MongoDB)"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pymongo",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["caco_analysis*"]
